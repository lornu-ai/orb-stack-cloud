apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: gap-fleet
    patch: |-
      - op: replace
        path: /data/role
        value: primary
      - op: replace
        path: /data/mac_id
        value: mac-a
