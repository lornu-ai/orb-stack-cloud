apiVersion: v1
kind: Service
metadata:
  name: gap-hub
  namespace: gap
  labels:
    app: gap-hub
  annotations:
    # OrbStack publishes this hostname on the Mac (local path).
    dev.orbstack.k8s/domains: gap.k8s.orb.local
spec:
  type: LoadBalancer
  selector:
    app: gap-hub
  ports:
    - name: http
      port: 8080
      targetPort: http
