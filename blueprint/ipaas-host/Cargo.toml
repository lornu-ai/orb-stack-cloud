[workspace]
resolver = "2"
members = [
  "crates/ipaas-compiler",
  "crates/ipaas-bun-bridge",
  "crates/ipaas-control-plane",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "=1.11.0", features = ["serde", "v4"] }
