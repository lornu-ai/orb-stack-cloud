apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-nginx
data:
  default.conf: |
    server {
      listen 8080;
      location /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
      }
      location /api/v1/checkout {
        proxy_pass http://auth-service:8080/;
      }
    }
