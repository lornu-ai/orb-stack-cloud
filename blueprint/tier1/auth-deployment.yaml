apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth
          image: hashicorp/http-echo:1.0.0
          args: ["-text=ok", "-listen=:8080"]
          ports:
            - containerPort: 8080
