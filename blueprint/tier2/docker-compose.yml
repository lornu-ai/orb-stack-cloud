# Story 7.2 — Cross-arch Compose on OrbStack Docker engine
services:
  legacy-billing-amd64:
    image: hashicorp/http-echo:1.0.0
    platform: linux/amd64
    command: ["-text=billing-ok", "-listen=:8080"]
    environment:
      DATABASE_URL: postgres://app:localcloud@postgres.orb.local:5432/microservices
    labels:
      - dev.orbstack.domains=billing.internal.orb.local
    networks:
      - orb-local

  localstack-aws:
    image: localstack/localstack:3
    platform: linux/arm64
    environment:
      SERVICES: s3,sqs
      DEBUG: "0"
    labels:
      - dev.orbstack.domains=s3.aws.orb.local,sqs.aws.orb.local
    ports:
      - "4566:4566"
    networks:
      - orb-local

networks:
  orb-local:
    driver: bridge
