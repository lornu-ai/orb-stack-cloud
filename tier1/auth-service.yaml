apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: local-cloud-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: local-cloud-apps
spec:
  selector:
    app: auth-service
  ports:
    - port: 80
      targetPort: 80
