apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vaultwarden
labels:
  - pairs:
      app.kubernetes.io/name: vaultwarden
      app.kubernetes.io/part-of: vaultwarden
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - backup/cronjob.yaml
configMapGenerator:
  - name: vaultwarden-config
    literals:
      # Overlays must override DOMAIN with the real tailnet URL.
      - DOMAIN=https://vaultwarden.TAILNET.ts.net
      - ROCKET_PORT=8080
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - SHOW_PASSWORD_HINT=false
      - PASSWORD_HINTS_ALLOWED=false
      - WEB_VAULT_ENABLED=true
      - LOG_LEVEL=info
  - name: vaultwarden-backup
    literals:
      # age X25519 public key (age1...). Overlays must override it.
      - AGE_RECIPIENT=age1REPLACE_WITH_BACKUP_RECIPIENT
      - RETENTION_DAYS=14
  - name: vaultwarden-backup-script
    files:
      - backup.sh=backup/backup.sh
