apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vaultwarden
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  path: ./deploy/vaultwarden/overlays/orbstack
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      # Placeholder: Secret in flux-system holding the age identity (key *.agekey).
      name: sops-age
  # Requires the Tailscale operator (ingressClassName: tailscale). If it is
  # managed by its own Flux Kustomization, declare the dependency:
  # dependsOn:
  #   - name: tailscale-operator
