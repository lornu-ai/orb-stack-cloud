apiVersion: v1
kind: Namespace
metadata:
  name: local-cloud
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-init-postgres
  namespace: local-cloud
data:
  user-data: |
    #cloud-config
    package_update: true
    packages:
      - postgresql-16
      - prometheus-node-exporter
    write_files:
      - path: /etc/postgresql/16/main/conf.d/cloud-tuning.conf
        content: |
          shared_buffers = 256MB
          max_connections = 100
    runcmd:
      - systemctl enable --now postgresql
      - systemctl enable --now prometheus-node-exporter
      - sudo -u postgres psql -c "CREATE USER app WITH PASSWORD 'localcloud';" || true
      - sudo -u postgres psql -c "CREATE DATABASE microservices OWNER app;" || true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-init-vault
  namespace: local-cloud
data:
  user-data: |
    #cloud-config
    package_update: true
    packages:
      - curl
      - jq
    runcmd:
      - echo "Vault/Consul bootstrap placeholder — install HashiCorp packages in prod template" > /tmp/vault-bootstrap.log
