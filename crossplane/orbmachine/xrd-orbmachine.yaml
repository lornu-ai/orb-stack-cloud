# Planning schema — Story 7.1. Not active until provider-orb + Epic 4.2 bridge.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xorbmachines.machines.cloud.orb.local
  labels:
    lornu.ai/managed-by: crossplane
    orbstack.lornu.ai/status: planning
spec:
  group: machines.cloud.orb.local
  names:
    kind: XOrbMachine
    plural: xorbmachines
  claimNames:
    kind: OrbMachineClaim
    plural: orbmachineclaims
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                distro:
                  type: string
                  enum: [ubuntu, debian, fedora, alpine]
                name:
                  type: string
                cpus:
                  type: integer
                  default: 2
                memory:
                  type: string
                  default: 2Gi
                cloudInitConfigMapRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                      default: local-cloud
                tailscale:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    hostname:
                      type: string
              required: [distro, name, cloudInitConfigMapRef]
            status:
              type: object
              properties:
                ready:
                  type: boolean
                orbMachineId:
                  type: string
          required: [spec]
