[workspace]
resolver = "2"
members = [
  "orbstack",
  "tailscale",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = "=0.7.9"
hyper = "=1.4.1"
hyper-util = "=0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.40.0", features = ["macros", "rt-multi-thread", "net", "sync", "io-util", "time", "process"] }
