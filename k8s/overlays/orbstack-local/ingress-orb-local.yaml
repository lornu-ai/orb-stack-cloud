# OrbStack default: LoadBalancer + *.k8s.orb.local when Gateway API is not installed.
apiVersion: v1
kind: Service
metadata:
  name: osc-web-lb
  namespace: stevedores
  labels:
    app.kubernetes.io/component: web-lb
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
