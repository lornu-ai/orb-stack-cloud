# Gateway API route — requires a Gateway in gateway-system (prod clusters).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: osc-orb-local-route
  namespace: stevedores
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: orbstack-gateway
      namespace: gateway-system
  hostnames:
    - "osc.k8s.orb.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: osc-web
          port: 80
