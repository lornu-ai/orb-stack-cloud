# Serves built web/dist from ConfigMap osc-web-static (created by deploy script).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osc-web
spec:
  replicas: 2
  template:
    spec:
      volumes:
        - name: static-index
          configMap:
            name: osc-web-static
        - name: static-assets
          configMap:
            name: osc-web-assets
      containers:
        - name: web
          image: docker.io/nginxinc/nginx-unprivileged:stable-alpine
          volumeMounts:
            - name: static-index
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: static-assets
              mountPath: /usr/share/nginx/html/assets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
