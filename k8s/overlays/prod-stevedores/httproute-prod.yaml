apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: osc-stevedores-route
  namespace: stevedores
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-multi-tenant-gateway
      namespace: gateway-system
  hostnames:
    - "osc.stevedores.org"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: osc-web
          port: 80
