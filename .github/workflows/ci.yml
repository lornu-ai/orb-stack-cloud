name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate manifests (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run ci:validate

  aws-localstack:
    name: AWS via LocalStack (Epic 7.3)
    runs-on: ubuntu-latest
    needs: validate
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: s3,sqs
          DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run ci:aws-localstack
        env:
          LOCALSTACK_ENDPOINT: http://127.0.0.1:4566
          AWS_DEFAULT_REGION: us-east-1
          TEST_S3_BUCKET: invoices-archive
          TEST_SQS_QUEUE: billing-events

  cloudflare:
    name: Cloudflare API smoke
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run ci:cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_NAME: ${{ vars.CF_ZONE_NAME }}

  gcp:
    name: GCP API smoke
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        id: auth
        continue-on-error: true
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run ci:gcp
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
